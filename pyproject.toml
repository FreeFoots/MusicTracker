[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "musictracker"
version = "0.6.1"
description = "Query-driven, evidence-backed QQ Music and NetEase research workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2,<3",
  "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "langgraph>=1,<2",
  "alembic>=1.16,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
musictracker = "musictracker.__main__:main"

[tool.setuptools.packages.find]
include = ["musictracker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
